# Spell check (CRM-T94): `typos` in CI. The translations are in other languages, so they are
# left out; the words below are names, identifiers and test data that look like misspellings.
[files]
extend-exclude = [
  "locales/**",
  "contact-relationship-management-ui-with-svelte/src/lib/locales/**",
  "contact-relationship-management-ui-with-svelte/src/lib/api/schema.d.ts",
  # The site's copy of the documents (the briefs in every language) and its own installed packages.
  "contact-relationship-management.github.io/src/content/**",
  "contact-relationship-management.github.io/node_modules/**",
  "contact-relationship-management.github.io/build/**",
  "contact-relationship-management.github.io/.svelte-kit/**",
  # The import header names in eight languages (CRM-T169): a word list, not prose.
  "contact-relationship-management-service-with-rust/src/rules/column_names.rs",
  # The public consent pages' words in eight languages (CRM-T175): translations, not prose.
  "contact-relationship-management-service-with-rust/src/rules/public_text.rs",
  "**/Cargo.lock",
  "**/pnpm-lock.yaml",
]

[default.extend-words]
# A deliberately misspelt request member (tests/requests/api_standards.rs, src/json.rs).
dispaly = "dispaly"
# `ANDed` (consent is ANDed), `-yse` British verb endings, nickname tables, test fixtures.
ded = "ded"
yse = "yse"
ned = "ned"
cmo = "cmo"
toi = "toi"
fo = "fo"
ba = "ba"
pn = "pn"
alikes = "alikes"
# Spanish ("Contactos"), the openEHR and WRK work-directory names.
contactos = "contactos"
ehr = "ehr"
wrk = "wrk"
# ISO 4217: the Jordanian dinar code, and the fils, the dinar's minor unit (CRM-T167).
jod = "jod"
fils = "fils"
# German test data: "Oktober" is the German month name a German date is checked against (CRM-T172).
oktober = "oktober"
# Vai, the Liberian script whose decimal digits the matcher reads in a phone number (CRM-T170).
vai = "vai"
# German, Spanish and French template fallbacks and import headers (CRM-T169): "Ihre Funktion",
# "cliente", "votre fonction", "E-Mail-Adresse", "entreprise".
funktion = "funktion"
cliente = "cliente"
fonction = "fonction"
adresse = "adresse"
entreprise = "entreprise"
# German formal address, named in the de-de review record (CRM-T175).
sie = "sie"
