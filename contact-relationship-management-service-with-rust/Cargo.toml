[workspace]
# CRM-T260: the domain rules, apart from routes and storage.
members = [".", "contact-relationship-management-domain"]

[package]
name = "contact-relationship-management"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
publish = true
default-run = "contact-relationship-management"
# The integration tests are one binary, tests/main.rs (CRM-T263): each file in tests/ was its own,
# and each linked the whole service.
autotests = false
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Contact Relationship Management (CRM): service for APIs, inbound contacts, outbound contacts, conversation automation, engagement analytics"
readme = "README.md"
repository = "https://github.com/contact-relationship-management/contact-relationship-management-service-with-rust"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-SA-4.0"
keywords = ["crm", "sales", "marketing", "support", "sfa"]
categories = ["development-tools", "rust-patterns"]
# `migrations/` is embedded by `sqlx::migrate!()` (CRM-T229), so the published crate needs it (CRM-T267).
include = ["src/**/*", "migrations/**/*", ".sqlx/**/*", ".cargo/config.toml", "sqlx.toml", "README.md"]

[workspace.dependencies]
# The shared plumbing. `sqlx`: `AppContext::db` is the `PgPool` (CRM-D24); `queue` is the Postgres job queue.
axa = { version = "0.21.0", features = ["postgres-sqlx", "queue", "redis", "problem", "ratelimit", "cursor-pagination"] }

[dependencies]
axa = { workspace = true }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "arbitrary_precision"] }
tokio = { version = "1.54", default-features = false, features = [
  "rt-multi-thread",
  "net",
  "fs",
  "process",
  "time",
] }
async-trait = { version = "0.1" }
# In-process calls to the service's own router, for the MCP endpoint (CRM-R30).
tower = { version = "0.5", features = ["util"] }
axum = { version = "0.8" }
tracing = { version = "0.1" }
contact-relationship-management-matcher = "0.2.1"
# Plain SQL, checked at build time against `.sqlx/` (CRM-D24). TLS to the database is rustls with
# the webpki roots, the backend axa's own sqlx uses; it was enabled through SeaORM until CRM-T232.
sqlx = { version = "0.9", default-features = false, features = [
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "sqlx-toml",
  "tls-rustls-ring-webpki",
  "uuid",
] }
# The domain rules and their dates and times (CRM-T260), in this workspace; `postgres` reads and
# writes its `Timestamp` and `Date` as `timestamptz` and `date`.
contact-relationship-management-domain = { version = "0.2.0", path = "contact-relationship-management-domain", features = ["postgres"] }
# CRM-T258: instants, dates and zones. The bundled time-zone database, as the distroless image has none.
jiff = { version = "1.0.0", default-features = false, features = ["std", "serde", "tzdb-bundle-always"] }
url = "2.5"
thiserror = "2.0"
csv = "1.4"
# A combining mark stays in a search word (CRM-T170); already in the tree through the matcher.
unicode-normalization = "0.1.26"
uuid = { version = "1.29", features = ["v4", "serde"] }
# Request schemas for the OpenAPI document come from the payload structs themselves (CRM-T83).
schemars = { version = "1.2", features = ["uuid1"] }

# Tamper-evident audit hash chain (CRM-T31).
sha2 = { version = "0.11" }
# Signed unsubscribe links (CRM-T39).
hmac = "0.13"
base64 = { version = "0.23" }
prometheus = { version = "0.14" }
# Upstream display-name lookups (`http` client mode only; stub is the
# default). Same minimal reqwest configuration as the verifier's fetch.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "json",
  "form",
] }
# reqwest takes no bundled TLS provider; axa installs `ring` at boot and before each test (`axa::tls::install_provider`).

# Outbound SMTP for the real send path (CRM-T39). rustls with ring and bundled web PKI
# roots; no OpenSSL.
lettre = { version = "0.11.24", default-features = false, features = [
  "builder",
  "smtp-transport",
  "tokio1",
  "tokio1-rustls",
  "ring",
  "webpki-roots",
] }

# Cross-service entity references (EntityRef URN + entity-type registry):
# people/workers/organizations/courses are referenced, never duplicated.
entity-ref = "0.2.1"

# Offline PASETO v4.public verification + the shared ABAC engine.
authentication-verifier = { version = "0.9.3", default-features = false }
aes-gcm = "0.11"
redis = { version = "1.8.1", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }

[features]
# PASETO bearer verification (the family default): `Verifier`, the boot key
# fetch and the rotation refresh. Turn it off (`--no-default-features`) for a
# deployment whose only bearer credential is a Keycloak access token.
default = ["paseto"]
paseto = ["authentication-verifier/paseto", "authentication-verifier/fetch"]
# Also accept Keycloak (OIDC) access tokens, configured by
# `CONTACT_RELATIONSHIP_MANAGEMENT_KEYCLOAK_*` (see src/auth/). Off by default.
keycloak = ["authentication-verifier/keycloak"]

[[test]]
name = "main"
path = "tests/main.rs"

[[bin]]
name = "contact-relationship-management"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
# Operators on instants for the unit tests only (production code uses `checked_*`).
contact-relationship-management-domain = { path = "contact-relationship-management-domain", features = ["postgres", "test-support"] }
# A local OIDC provider so tests/keycloak_guard.rs can push a Keycloak access
# token through the real guard without a Keycloak container. Tests only.
authentication-verifier = { version = "0.9.3", default-features = false, features = ["test-idp"] }
axa-test = { version = "0.12.0" }
# `TestServer` for the unit tests that serve a bare router (src/controllers).
axum-test = { version = "21.1.0" }
# Drive a single middleware with `oneshot` in its unit tests.
tokio = { version = "1.54", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "net",
  # A paused clock, so the policy watcher's 15-second poll can be tested without waiting (CRM-T292).
  "test-util",
] }
serial_test = { version = "4.0.1" }
# Mint PASETO v4.public tokens + a matching Ed25519 key set in-process so
# the auth path is verified without the auth service or a network.
ed25519-dalek = { version = "3.0.0" }
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"] }
jsonschema = { version = "0.60", default-features = false }

# Mutation testing (CRM-T259): each mutant is built once and thrown away, so it skips the debug
# information a test build makes, most of a mutant's link time. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false

# Faster dev/test builds: keep line tables for backtraces, drop the rest of the debug info.
# RCA-ENF-4: a release build checks overflow, so an operator the lints miss panics, which can be
# seen, and never wraps, which cannot. A backstop only; the code still uses checked_* (RCA-P-1).
[profile.release]
overflow-checks = true

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
