[workspace]

[package]
name = "contact-relationship-management"
version = "0.1.5"
edition = "2024"
rust-version = "1.99"
publish = true
default-run = "contact-relationship-management"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Contact Relationship Management (CRM): service for APIs, inbound contacts, outbound contacts, conversation automation, engagement analytics"
readme = "README.md"
repository = "https://github.com/contact-relationship-management/contact-relationship-management-service-with-rust"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
keywords = ["crm", "sales", "marketing", "support", "sfa"]
categories = ["development-tools", "rust-patterns"]
include = ["src/**/*", "README.md"]

[workspace.dependencies]
# `auth` is deliberately absent from this feature list. It is loco's JWT
# support (`dep:jsonwebtoken`, and therefore `rsa` / RUSTSEC-2023-0071),
# and this family issues PASETO v4.public rather than JWT — see
# agents/share/jwt.md. Dropping it removes the vulnerable crate from the
# dependency graph rather than suppressing the advisory.
loco-rs = { version = "1.2.0", default-features = false, features = ["cli", "with-db", "cache_inmem", "cache_redis", "worker"] }

[dependencies]
loco-rs = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }
tokio = { version = "1.53", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
contact-relationship-management-matcher = "0.1.1"
migration = { package = "contact-relationship-management-migration", version = "0.1.0", path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
url = "2.5"
uuid = { version = "1.26", features = ["v4", "serde"] }
mimalloc = { version = "0.1.52" }
# Tamper-evident audit hash chain (CRM-T31).
sha2 = { version = "0.11" }
# Signed unsubscribe links (CRM-T39).
hmac = "0.13"
base64 = { version = "0.23" }
prometheus = { version = "0.14" }
# Upstream display-name lookups (`http` client mode only; stub is the
# default). Same minimal reqwest configuration as the verifier's fetch.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }

# Outbound SMTP for the real send path (CRM-T39). rustls with aws-lc-rs (the
# provider the rest of the tree already uses) and bundled web PKI roots; no
# OpenSSL.
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "smtp-transport",
  "tokio1",
  "tokio1-rustls",
  "aws-lc-rs",
  "webpki-roots",
] }

# Cross-service entity references (EntityRef URN + entity-type registry):
# people/workers/organizations/courses are referenced, never duplicated.
entity-ref = "0.2.0"

# Offline PASETO v4.public verification + the shared ABAC engine.
authentication-verifier = { version = "0.9.1", default-features = false }
aes-gcm = "0.11"
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }

[features]
# PASETO bearer verification (the family default): `Verifier`, the boot key
# fetch and the rotation refresh. Turn it off (`--no-default-features`) for a
# deployment whose only bearer credential is a Keycloak access token.
default = ["paseto"]
paseto = ["authentication-verifier/paseto", "authentication-verifier/fetch"]
# Also accept Keycloak (OIDC) access tokens, configured by
# `CRM_KEYCLOAK_*` (see src/auth/). Off by default.
keycloak = ["authentication-verifier/keycloak"]

[[bin]]
name = "contact-relationship-management"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
# A local OIDC provider so tests/keycloak_guard.rs can push a Keycloak access
# token through the real guard without a Keycloak container. Tests only.
authentication-verifier = { version = "0.9.1", default-features = false, features = ["test-idp"] }
loco-rs = { workspace = true, features = ["testing"] }
# Name the `TestServer` type in shared request-test helpers (same
# version loco's testing feature uses internally).
axum-test = { version = "21.1.0" }
tokio = { version = "1.53", default-features = false, features = [
  "rt-multi-thread",
  "macros",
  "net",
] }
serial_test = { version = "4.0.1" }
# Mint PASETO v4.public tokens + a matching Ed25519 key set in-process so
# the auth path is verified without the auth service or a network.
ed25519-dalek = { version = "3.0.0" }
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_public", "serde_json"] }
jsonschema = { version = "0.58", default-features = false }
