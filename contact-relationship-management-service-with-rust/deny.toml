# cargo-deny policy (CRM-T34): advisories, licences, duplicate/banned crates,
# and where code may come from. Run by `scripts/ci-check.sh supply-chain`.

[advisories]
version = 2
# Each entry is reviewed and says why; drop it when its reason no longer holds.
ignore = [
  # chrono is unmaintained (informational; no vulnerability, no fixed version). The service's own
  # code moved to jiff in CRM-T258, and since axa 0.19 (CRM-T261) nothing the service ships builds
  # it: it comes only into the tests, through axa-test's axum-test (`expect-json`). Drop this when
  # axum-test no longer pulls it in.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, not vulnerable; test builds only, through axum-test (expect-json), CRM-T261" },
]

[licenses]
version = 2
# Permissive licences only for dependencies. The workspace's own crates are
# `MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-SA-4.0`;
# an OR expression is satisfied by any one allowed term.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
# The migration crate is a path dependency of a publishable crate, which
# cargo-deny reports as a wildcard.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
