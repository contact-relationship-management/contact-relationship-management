# cargo-deny policy (CRM-T34): advisories, licences, duplicate/banned crates,
# and where code may come from. Run by `scripts/ci-check.sh supply-chain`.

[advisories]
version = 2
ignore = [
  # `unsafe-libyaml` is unmaintained (no known vulnerability). It arrives only
  # through Loco's code generator (`loco-gen` -> `rrgen` -> `serde_yaml` 0.9),
  # which this service cannot drop while it uses Loco. Revisit on a Loco upgrade
  # (Loco's own config loader already uses `serde_yaml_ng`).
  { id = "RUSTSEC-2024-0449", reason = "unmaintained, no vulnerability; only via loco-gen; revisit on a Loco upgrade" },
]

[licenses]
version = 2
# Permissive licences only for dependencies. The workspace's own crates are
# `MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only`;
# an OR expression is satisfied by any one allowed term.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
# The migration crate is a path dependency of a publishable crate, which
# cargo-deny reports as a wildcard.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/SixArm/main-x-service.git"]
