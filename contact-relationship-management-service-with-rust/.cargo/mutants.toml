# Mutation testing (CRM-T94): the pure rules are where a surviving mutant means a missing test.
# Unit tests only (`--lib`): they need no database. A full run over `rules/` is still hours at
# `-j 2` (CRM-T184), so scripts/nightly.sh runs a seventh a night. The controllers are left to the
# request tests, which need PostgreSQL.
examine_globs = ["src/rules/**/*.rs"]
additional_cargo_test_args = ["--lib"]
