# Pin the Rust toolchain for this repository.
#
# Every crate in this tree
# inherits this pin, so `cargo build`, `cargo clippy`, and especially
# `cargo fmt` produce identical results on every machine and in CI. It
# exists because a rustfmt version drift caused repo-wide formatting churn;
# pinning the exact toolchain prevents that from recurring.
#
# Bump deliberately (in one commit, re-running `cargo fmt` across all
# crates) rather than letting `rustup` float.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
