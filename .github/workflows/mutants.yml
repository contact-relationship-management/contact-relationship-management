name: Mutation testing
# Weekly, not on every push: it re-runs the unit tests once for each small change to a rule in
# the domain crate's rules (about 1,600 of them; CRM-T260). A surviving mutant is a rule that no test pins (CRM-T94).
# The whole set in one job was cancelled at six hours, so seven jobs take a seventh each (CRM-T195).
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      # A missed mutant fails its job, and the other shards still have to finish.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    env:
      CONTACT_RELATIONSHIP_MANAGEMENT_MUTANTS_SHARD: ${{ matrix.shard }}/7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-mutants
      - run: scripts/ci-check.sh mutants
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: |
            contact-relationship-management-service-with-rust/contact-relationship-management-domain/mutants-out/
            contact-relationship-management-matcher-with-rust/mutants-out/
