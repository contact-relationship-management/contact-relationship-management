name: Load Test

# Runs one k6 load test from tests/load/ against a service you name. Manual only: the
# tests need a running service with a throwaway database, and the runner has none, so
# there is no push, pull-request or scheduled trigger.
#
# To run: Actions > Load Test > Run workflow, then choose the test, the URL and the size.
# Set the repository secret CONTACT_RELATIONSHIP_MANAGEMENT_LOAD_TEST_AUTH_TOKEN if the service has sign-in on.
#
# k6 runs from the pinned image, as tests/long-running/Makefile does. Inputs reach the
# shell only through environment variables, never through template expansion.

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: Load test to run (tests/load/scripts/<name>.test.js)
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - basic-load
          - stress
          - spike
          - soak
          - seed
          - endpoints
          - breakpoint
      url:
        description: Service base URL (a throwaway deployment, never production)
        required: true
        type: string
      vus:
        description: Virtual users (blank for the script's default; smoke always uses one)
        required: false
        default: ""
        type: string
      duration:
        description: Duration, for example 1m or 10m (blank for the script's default; see each script)
        required: false
        default: ""
        type: string
      rate:
        description: Requests a second per group (endpoints) or the highest rate (breakpoint); blank for the default
        required: false
        default: ""
        type: string
      seed:
        description: Contacts to make (seed); blank for the default of 1000
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  load-test:
    name: Load test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      K6_IMAGE: docker.io/grafana/k6:1.4.2@sha256:3656673de3f30424e8ebcfa46acd9558d83b6a43612d0f668ffeac953950c6c7
      TEST_TYPE: ${{ inputs.test_type }}
      TEST_URL: ${{ inputs.url }}
      VUS: ${{ inputs.vus }}
      DURATION: ${{ inputs.duration }}
      RATE: ${{ inputs.rate }}
      SEED: ${{ inputs.seed }}
      CONTACT_RELATIONSHIP_MANAGEMENT_AUTH_TOKEN: ${{ secrets.CONTACT_RELATIONSHIP_MANAGEMENT_LOAD_TEST_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check inputs
        run: |
          case "$VUS" in *[!0-9]*) echo "vus must be a whole number" >&2; exit 1 ;; esac
          case "$DURATION" in *[!0-9smh]*) echo "duration must look like 30s, 10m or 1h" >&2; exit 1 ;; esac
          case "$RATE" in *[!0-9]*) echo "rate must be a whole number" >&2; exit 1 ;; esac
          case "$SEED" in *[!0-9]*) echo "seed must be a whole number" >&2; exit 1 ;; esac
          case "$TEST_URL" in http://*|https://*) ;; *) echo "url must start with http:// or https://" >&2; exit 1 ;; esac

      - name: Run k6
        run: |
          mkdir -p tests/load/results
          # The scripts read VUS and DURATION themselves (blank keeps their defaults), so
          # their scenarios stand; --vus and --duration would replace them with one.
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/tests/load:/work" -w /work \
            -e TEST_URL -e CONTACT_RELATIONSHIP_MANAGEMENT_AUTH_TOKEN -e VUS -e DURATION -e RATE -e SEED -e "MAX_RATE=${RATE}" \
            -e K6_WEB_DASHBOARD=true -e "K6_WEB_DASHBOARD_EXPORT=results/${TEST_TYPE}.html" \
            "$K6_IMAGE" run \
            --summary-export "results/${TEST_TYPE}-summary.json" \
            "scripts/${TEST_TYPE}.test.js"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-test-results-${{ inputs.test_type }}
          path: tests/load/results/
          if-no-files-found: ignore
