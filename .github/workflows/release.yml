name: Release
# Builds both images from a version tag, pushes them to GitHub Container
# Registry, and signs them (CRM-T49). Signing is keyless: cosign uses the
# workflow's OIDC identity, so there is no private key to store or leak. The
# signature, a build-provenance attestation and the CycloneDX SBOMs are
# attached to each image digest. Verify with the commands in
# spec/compliance/operations-runbook.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing
      attestations: write   # build provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: service
            context: contact-relationship-management-service-with-rust
          - name: ui
            context: contact-relationship-management-ui-with-svelte
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Containerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
          # The base images are pinned by digest in the Containerfiles.
          provenance: false
      - name: Sign the image by digest
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  sbom:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contact-relationship-management-service-with-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: sigstore/cosign-installer@v3
      - run: scripts/ci-check.sh supply-chain
      - name: Sign the SBOMs
        run: |
          for file in sbom/*.json; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "${file}"
          done
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes sbom/* \
            || gh release upload "${{ github.ref_name }}" sbom/* --clobber
