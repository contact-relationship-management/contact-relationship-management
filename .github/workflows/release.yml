name: Release
# Builds both images from a version tag for amd64 and arm64 (each on a native
# runner, no emulation), joins them into one multi-arch image per name, pushes
# them to GitHub Container Registry, and signs them (CRM-T49). Signing is keyless: cosign uses the
# workflow's OIDC identity, so there is no private key to store or leak. The
# signature, a build-provenance attestation and the CycloneDX SBOMs are
# attached to each image digest. Verify with the commands in
# spec/compliance/operations-runbook.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  images:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing
      attestations: write   # build provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: service, context: contact-relationship-management-service-with-rust, arch: amd64, runner: ubuntu-latest }
          - { name: service, context: contact-relationship-management-service-with-rust, arch: arm64, runner: ubuntu-24.04-arm }
          - { name: ui, context: contact-relationship-management-ui-with-svelte, arch: amd64, runner: ubuntu-latest }
          - { name: ui, context: contact-relationship-management-ui-with-svelte, arch: arm64, runner: ubuntu-24.04-arm }
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}
      # One credentials file for podman, cosign and the attestation action
      # (cosign and the action read the Docker-style path, not podman's own).
      REGISTRY_AUTH_FILE: /home/runner/.docker/config.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Podman, not Docker: it is on the runner image and builds the same
      # Containerfiles that developers build. The base images are pinned by
      # digest in the Containerfiles.
      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$(dirname "${REGISTRY_AUTH_FILE}")"
          printf '%s' "${REGISTRY_TOKEN}" \
            | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
      - id: version
        name: Check that the tag, the manifest and the image agree
        run: echo "version=$(scripts/release-version.sh "${{ matrix.name }}" "${{ github.ref_name }}")" >> "${GITHUB_OUTPUT}"
      - name: Build
        run: |
          podman build \
            --build-arg "VERSION=${{ steps.version.outputs.version }}" \
            --build-arg "REVISION=${{ github.sha }}" \
            --file "${{ matrix.context }}/Containerfile" \
            --tag "${IMAGE}:${{ github.ref_name }}-${{ matrix.arch }}" \
            "${{ matrix.context }}"
      - name: Check the image's own version label
        run: |
          label="$(podman inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${IMAGE}:${{ github.ref_name }}-${{ matrix.arch }}")"
          test "${label}" = "${{ steps.version.outputs.version }}" \
            || { echo "image label '${label}' is not ${{ steps.version.outputs.version }}" >&2; exit 1; }
      - id: build
        name: Push, and read the pushed digest
        run: |
          # Pushed under an architecture tag; the `manifest` job joins the two.
          podman push --digestfile "${RUNNER_TEMP}/digest" "${IMAGE}:${{ github.ref_name }}-${{ matrix.arch }}"
          echo "digest=$(cat "${RUNNER_TEMP}/digest")" >> "${GITHUB_OUTPUT}"
      - name: Sign the image by digest
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  manifest:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        name: [service, ui]
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.name }}
      REGISTRY_AUTH_FILE: /home/runner/.docker/config.json
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$(dirname "${REGISTRY_AUTH_FILE}")"
          printf '%s' "${REGISTRY_TOKEN}" \
            | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Join the two architectures into one image
        run: |
          podman manifest create "${IMAGE}:${{ github.ref_name }}"
          for arch in amd64 arm64; do
            podman manifest add "${IMAGE}:${{ github.ref_name }}" "docker://${IMAGE}:${{ github.ref_name }}-${arch}"
          done
      - id: build
        name: Push, and read the pushed digest
        run: |
          podman manifest push --all --digestfile "${RUNNER_TEMP}/digest" \
            "${IMAGE}:${{ github.ref_name }}" "docker://${IMAGE}:${{ github.ref_name }}"
          echo "digest=$(cat "${RUNNER_TEMP}/digest")" >> "${GITHUB_OUTPUT}"
      - name: Sign the multi-arch image by digest
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  sbom:
    needs: [images, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: contact-relationship-management-service-with-rust
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit,cargo-deny,cargo-cyclonedx
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.0.8
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: scripts/ci-check.sh supply-chain
      - name: Sign the SBOMs
        run: |
          for file in sbom/*.json; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "${file}"
          done
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag with a hyphen (v1.2.3-rc.1) is a pre-release.
          flags=""
          case "${{ github.ref_name }}" in *-*) flags="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" --generate-notes $flags sbom/* \
            || gh release upload "${{ github.ref_name }}" sbom/* --clobber
