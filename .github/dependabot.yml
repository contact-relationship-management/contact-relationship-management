# Keeps dependencies and the pinned base-image digests current (CRM-T49).
# Digest pins never update themselves; without this they would freeze on
# known-vulnerable layers.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /contact-relationship-management-service-with-rust
    schedule:
      interval: weekly
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  # The migrations crate is a path dependency of the service and has no
  # lockfile of its own, so the service entry above covers it.
  - package-ecosystem: cargo
    directory: /contact-relationship-management-matcher-with-rust
    schedule:
      interval: weekly
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /contact-relationship-management-ui-with-svelte
    schedule:
      interval: weekly
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /contact-relationship-management-service-with-rust
    schedule:
      interval: weekly
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /contact-relationship-management-ui-with-svelte
    schedule:
      interval: weekly
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
  - package-ecosystem: docker-compose
    directory: /contact-relationship-management-service-with-rust
    schedule:
      interval: weekly
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
  # The GitHub Pages site (spec/github-pages-site.md).
  - package-ecosystem: npm
    directory: /contact-relationship-management.github.io
    schedule:
      interval: weekly
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
    groups:
      npm-site:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
