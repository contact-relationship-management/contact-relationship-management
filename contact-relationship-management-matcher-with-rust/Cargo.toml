[workspace]

[package]
name = "contact-relationship-management-matcher"
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
publish = true
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Contact matcher for a CRM: the probability that two contact records are the same person, from names, nicknames, email, phone, organisation and job title, with a per-field explanation"
readme = "README.md"
repository = "https://github.com/contact-relationship-management/contact-relationship-management"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
keywords = ["crm", "contacts", "matching", "deduplication", "record-linkage"]
categories = ["algorithms", "data-structures"]
include = ["src/**/*", "README.md", "CHANGELOG.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
strsim = "0.11.1"
unicode-normalization = "0.1.26"

[dev-dependencies]
# Independent Unicode 18 category data for the exhaustive phone-digit test.
unicode-properties = { version = "=0.1.5", default-features = false, features = ["general-category"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"

[[bench]]
name = "matching"
harness = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

# Faster dev/test builds: keep line tables for backtraces, drop the rest of the debug info.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# cargo-mutants builds every mutant once in a throwaway copy of the tree: no debug information and no
# incremental state make each build quicker and smaller. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false
