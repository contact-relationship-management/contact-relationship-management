# Codeberg CI (Woodpecker). Same entry point as .github/workflows/ci.yml.
when:
  - event: [push, pull_request, manual]

variables:
  # rust-toolchain.toml carries the exact pin; rustup honours it.
  - &rust_image 'rust:1.99-bookworm@sha256:9181b56c2a21ab1d5e73cffe04fc762426d30aa7fac3c91141dd033f49a7fc8b'

services:
  - name: postgres
    image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: loco
      POSTGRES_PASSWORD: loco
      POSTGRES_DB: postgres
  - name: redis
    image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537

steps:
  - name: fmt
    image: *rust_image
    commands:
      - rustup component add rustfmt
      - scripts/ci-check.sh fmt

  - name: clippy
    image: *rust_image
    commands:
      - rustup component add clippy
      - scripts/ci-check.sh clippy

  - name: test
    image: *rust_image
    commands:
      - scripts/ci-check.sh test

  - name: test-db
    image: *rust_image
    environment:
      PG_HOST: postgres
      REDIS_HOST: redis
    commands:
      - apt-get update && apt-get install -y --no-install-recommends postgresql-client
      - cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls,sqlx-toml
      - scripts/ci-check.sh test-db

  - name: front-end
    image: 'node:26-bookworm@sha256:fa52d1669505e29b58c042875b1d65c229e0787a3610fd52869b22b68e480853'
    commands:
      # Node 25+ no longer ships corepack.
      - npm install --global pnpm@11.0.8
      - scripts/ci-check.sh front-end

  - name: e2e
    image: 'node:26-bookworm@sha256:fa52d1669505e29b58c042875b1d65c229e0787a3610fd52869b22b68e480853'
    commands:
      - npm install --global pnpm@11.0.8
      - scripts/ci-check.sh e2e

  - name: api-types
    image: *rust_image
    commands:
      - curl -fsSL https://deb.nodesource.com/setup_26.x | bash - && apt-get install -y nodejs
      - npm install --global pnpm@11.0.8
      - scripts/ci-check.sh api-types

  - name: coverage
    image: *rust_image
    commands:
      - rustup component add llvm-tools-preview
      - cargo install --locked cargo-llvm-cov
      - scripts/ci-check.sh coverage

  - name: scripts
    image: 'debian:bookworm-slim@sha256:99c0b25c46d0214d5a2091092e7908907dcaecd6a962cde0ac700acee222b6f3'
    commands:
      - apt-get update && apt-get install -y --no-install-recommends shellcheck
      - scripts/ci-check.sh scripts

  - name: lint
    image: *rust_image
    commands:
      - cargo install --locked typos-cli zizmor rumdl
      - scripts/ci-check.sh lint

  - name: supply-chain
    image: *rust_image
    commands:
      - cargo install --locked cargo-audit cargo-deny cargo-cyclonedx
      # The same Node major as package.json's engines; Node 25+ has no corepack.
      - curl -fsSL https://deb.nodesource.com/setup_26.x | bash - && apt-get install -y nodejs
      - npm install --global pnpm@11.0.8
      - scripts/ci-check.sh supply-chain
