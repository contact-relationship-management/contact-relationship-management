# Versions match the Lily Design System build this app includes (vendor/lily-design-system/lily-design-system-kotlin),
# so the composite build resolves one AGP, one Kotlin and one Compose BOM.
[versions]
agp = "9.5.1"
kotlin = "2.4.21"
compose-bom = "2026.11.01"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
coroutines = "1.10.2"
kotlinx-serialization = "1.13.0"
junit = "4.13.2"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
junit = { module = "junit:junit", version.ref = "junit" }
lily-compose = { module = "io.github.lilydesignsystem:lily-compose", version = "0.1.0" }
lily-compose-themes = { module = "io.github.lilydesignsystem:lily-compose-themes", version = "0.1.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
