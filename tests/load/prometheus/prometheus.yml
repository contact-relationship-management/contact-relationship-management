# Prometheus configuration for k6 load testing
#
# This configuration sets up Prometheus to:
# - Scrape metrics from k6 instances
# - Store metrics in local storage
# - Provide alerting capabilities
#
# k6 exports Prometheus metrics at :6565/metrics

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 10s

# Rule files for alerting
rule_files:
  - /etc/prometheus/alert.rules

# Alert manager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape k6 master
  - job_name: 'k6-master'
    static_configs:
      - targets: ['k6-master:6565']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Scrape k6 workers (discover via DNS)
  - job_name: 'k6-workers'
    dns_sd_configs:
      - names:
          - 'k6-worker'
        type: 'A'
        port: 6565
    metrics_path: '/metrics'
    scrape_interval: 5s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: worker
      - source_labels: [__address__]
        regex: '(.*):6565'
        replacement: '${1}'
        target_label: instance

  # Scrape Node exporter (if running)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 10s

  # Scrape application metrics (if Prometheus endpoint is exposed)
  - job_name: 'crm-application'
    static_configs:
      - targets: ['crm-app:8080']
    metrics_path: '/metrics.prom'
    scrape_interval: 10s

# Remote write configuration for sending metrics to external systems
# Uncomment and configure if you want to send metrics to a remote Prometheus
# remote_write:
#   - url: 'https://your-remote-prometheus/api/v1/write'
#     basic_auth:
#       username: 'username'
#       password: 'password'
